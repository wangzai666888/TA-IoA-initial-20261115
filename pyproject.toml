[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co-ioa-clean"
version = "0.2.0"
description = "Contact-constrained collaboration with IoA infrastructure and independent state machines"
requires-python = ">=3.11"
dependencies = ["ortools==9.14.6206", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets==13.1", "httpx>=0.27,<1", "python-dotenv>=1,<2", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
co-ioa = "co_ioa.run:main"
co-ioa-api = "co_ioa.api:main"

[tool.setuptools.packages.find]
include = ["co_ioa*", "im_client*", "im_server*", "common*"]
exclude = ["im_server.frontend*"]

[tool.setuptools.package-data]
co_ioa = ["scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
