name: co-ioa-clean
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PIP_INDEX_URL: ${CO_IOA_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment: &environment
      CO_IOA_API_BASE: ${CO_IOA_API_BASE:-}
      CO_IOA_MODEL: ${CO_IOA_MODEL:-}
      CO_IOA_API_KEY: ${CO_IOA_API_KEY:-}
      CO_IOA_ALLOW_UNAUTHENTICATED: ${CO_IOA_ALLOW_UNAUTHENTICATED:-false}
      CO_IOA_MODEL_TIMEOUT: ${CO_IOA_MODEL_TIMEOUT:-120}
      CO_IOA_TEMPERATURE: ${CO_IOA_TEMPERATURE:-0}
      CO_IOA_CONTROL_KEY: ${CO_IOA_CONTROL_KEY:-}
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["../runs:/app/runs"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 150s
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api:
        condition: service_healthy
  experiment:
    profiles: ["batch"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PIP_INDEX_URL: ${CO_IOA_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment: *environment
    volumes: ["../runs:/app/runs"]
    command: ["python", "-m", "co_ioa.experiments", "--backend", "ioa", "--planner", "rule", "--output", "/app/runs/batch"]
